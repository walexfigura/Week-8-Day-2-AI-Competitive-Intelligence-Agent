[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-competitive-intelligence"
version = "1.0.0"
description = "Educational AI competitive intelligence agent (Week 8, Day 2 of 10 Weeks to AI Agents). Fictional data only."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alex Figura" }]
dependencies = [
    "openai>=2.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
northstar-ci = "competitive_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E701", "E731", "B008"]
